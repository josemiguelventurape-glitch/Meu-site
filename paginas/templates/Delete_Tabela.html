{% extends "Base.html" %}

{% block content %}

<p>Tem certeza que quer excluir <strong>{{ Projects.Titulo }}</strong>?</p>

<form method="post">
  {% csrf_token %}
  <button type="submit">Sim, excluir</button>
  <a href="{% url 'Categories' %}">Cancelar</a>
</form>
{% endblock %}

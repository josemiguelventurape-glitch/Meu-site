{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Listas de Jogos Zerados{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header>
    <div class="topo">
      <h1>Listas de Jogos Zerados</h1>

      <nav class="menu">
        <a href="{% url 'Start' %}" class="card2">Start</a>
        <a href="{% url 'Games' %}" class="card2">Games</a>
        <a href="{% url 'admin:index' %}" class="card2">Admin</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>Made by: Ventz</p>
  </footer>

  {% block extra_js %}{% endblock %}
</body>
</html>
